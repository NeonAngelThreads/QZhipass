spring.application.name=QZhipass
spring.application.version=1.0.0
server.port=7510

microservice.workerid = 0
microservice.dadacenterid = 0

# Redis Configuration (disabled for local dev)
spring.main.allow-bean-definition-overriding=true

spring.data.redis.host=192.168.1.6
spring.data.redis.password=dadam1900
spring.data.redis.port=6379
spring.data.redis.timeout=5000
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-idle=8

# MySQL Configuration (use environment variables for production)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://192.168.1.6:3306/Qzhipass}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:YourSecretKeyForJwtTokenGeneration1234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Admin configuration: comma-separated phone numbers of admin users
admin.phones=${ADMIN_PHONES:}

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:企智通}

# ==================== Spring AI Configuration ====================
# DeepSeek API (OpenAI-compatible) — the only configured provider
spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.base-url=${AI_API_BASE:https://api.deepseek.com/v1}
spring.ai.openai.chat.options.model=${AI_CHAT_MODEL:deepseek-chat}
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=4096
# Embedded models (for vector embeddings)
spring.ai.openai.embedding.options.model=${AI_EMBEDDING_MODEL:text-embedding-3-small}
# Ollama (local fallback)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen3}
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
# Retry & resilience
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2000
spring.ai.retry.backoff.multiplier=2.0
spring.ai.retry.backoff.max-interval=30000

# Conversation persistence and context window settings
ai.api-key=${AGENT_AI_API_KEY:${AI_API_KEY:}}
ai.base-url=${AI_API_BASE:https://api.deepseek.com/v1}
ai.chat-model=${AI_CHAT_MODEL:deepseek-chat}
ai.system-prompt=${AI_SYSTEM_PROMPT:You are a helpful enterprise work assistant.}
ai.context.max-tokens=${AI_CONTEXT_MAX_TOKENS:4000}
ai.context.raw-tokens=${AI_CONTEXT_RAW_TOKENS:2000}
ai.context.safety-margin=${AI_CONTEXT_SAFETY_MARGIN:160}
ai.completion.max-tokens=${AI_COMPLETION_MAX_TOKENS:1000}
agent.runtime.cache-ttl=${AGENT_CACHE_TTL:PT30M}
agent.react.allowed-tools=${AGENT_ALLOWED_TOOLS:calculator,current_time}
agent.react.local-instructions=${AGENT_LOCAL_INSTRUCTIONS:Use tools only when they materially improve accuracy.}
agent.react.max-steps=${AGENT_MAX_STEPS:8}
agent.react.max-input-tokens=${AGENT_MAX_INPUT_TOKENS:6000}
agent.react.max-completion-tokens=${AGENT_MAX_COMPLETION_TOKENS:1000}
agent.react.max-observation-length=${AGENT_MAX_OBSERVATION_LENGTH:4000}
agent.react.total-timeout=${AGENT_TOTAL_TIMEOUT:PT90S}
agent.react.request-lock-ttl=${AGENT_REQUEST_LOCK_TTL:PT2M}
conversation.checkpoint.interval-ms=${CONVERSATION_CHECKPOINT_INTERVAL_MS:300000}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>企智通 · 员工工作台</title>
<style>
  :root { --primary:#4f46e5; --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
    --danger:#ef4444; --success:#10b981; --bg:#f5f7fb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); }
  .user-panel { position:fixed; top:16px; left:16px; width:280px; background:#fff;
    border:1px solid var(--border); border-radius:14px; padding:16px; z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .user-panel h3 { margin:0 0 4px; font-size:15px; }
  .user-panel .dept { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .token-line { display:flex; justify-content:space-between; font-size:13px; margin:6px 0; }
  .token-line b { font-size:15px; }
  .bar { height:10px; background:#eef2ff; border-radius:6px; overflow:hidden; margin-top:6px; }
  .bar > i { display:block; height:100%; background:var(--primary); transition:width .3s; }
  .bar > i.over { background:var(--danger); }
  .status { margin-top:10px; font-size:12px; }
  .status.over { color:var(--danger); }
  .status.ok { color:var(--success); }
  .logout-btn { display:block; width:100%; margin-top:12px; padding:8px; background:#f1f5f9;
    border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:12px; color:var(--muted); text-align:center; }
  .logout-btn:hover { background:#e2e8f0; }
  main { margin-left:320px; padding:24px; max-width:760px; }
  h1 { font-size:20px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
  textarea { width:100%; min-height:90px; border:1px solid var(--border); border-radius:8px;
    padding:10px; font-size:14px; resize:vertical; }
  button.primary { background:var(--primary); color:#fff; border:0; padding:10px 18px;
    border-radius:8px; font-size:14px; cursor:pointer; margin-top:10px; }
  button.primary:disabled { background:#c7c9d9; cursor:not-allowed; }
  .chat-log { background:#fafaff; border:1px solid var(--border); border-radius:8px;
    padding:12px; min-height:80px; font-size:14px; white-space:pre-wrap; }
  .toolbar { margin-bottom:12px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  input[type=number] { padding:8px 10px; border:1px solid var(--border); border-radius:8px; width:160px; }
  input[type=text] { padding:8px 10px; border:1px solid var(--border); border-radius:8px; width:140px; }
  label { font-size:13px; color:var(--muted); margin-right:4px; }
  .warn { color:var(--danger); font-weight:600; }
</style>
</head>
<body>

<div class="user-panel" id="user-panel">
  <h3 id="up-name">—</h3>
  <div class="dept" id="up-dept">部门：—</div>
  <div class="token-line"><span>当日 Token 限额</span><b id="up-quota">0</b></div>
  <div class="token-line"><span>已使用</span><b id="up-used">0</b></div>
  <div class="token-line"><span>剩余</span><b id="up-remain">0</b></div>
  <div class="bar"><i id="up-bar" style="width:0%"></i></div>
  <div class="status ok" id="up-status">状态正常</div>
  <button class="logout-btn" onclick="doLogout()">退出登录</button>
</div>

<main>
  <h1>员工工作台 · 智能对话</h1>

  <div class="card">
    <div class="toolbar">
      <label>用户ID</label>
      <input type="number" id="uid" value="" />
      <label>模型</label>
      <input type="text" id="model" value="千问" />
      <button class="primary" onclick="refreshPanel()" style="margin-top:0;">刷新我的 Token 状态</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">发起对话（服务端自动检测 Token 超额）</h3>
    <p style="font-size:13px;color:var(--muted);">点击下方按钮模拟发起对话，服务端拦截器会自动检测并拒绝超额用户的请求。</p>
    <button class="primary" id="start-btn" onclick="startChat()">发起新对话</button>
    <div id="check-tip" style="margin-top:10px;font-size:13px;"></div>
  </div>

  <div class="card" id="chat-card" style="display:none;">
    <h3 style="margin-top:0;">对话窗口</h3>
    <div class="chat-log" id="chat-log">（对话已开启，可发送一条模拟消息以记录 token 消耗）</div>
    <textarea id="msg" placeholder="输入消息内容…"></textarea>
    <div>
      <label>本次消耗 Token（模拟）</label>
      <input type="number" id="tok" value="5000" min="1" />
      <button class="primary" onclick="sendMessage()">发送消息</button>
    </div>
  </div>
</main>

<script>
const API = 'http://localhost:7511';

function uid() {
  const stored = localStorage.getItem('currentUserId');
  if (stored) document.getElementById('uid').value = stored;
  return document.getElementById('uid').value || stored || '1';
}

function model() { return document.getElementById('model').value || '千问'; }

function doLogout() {
  if (confirm('确认退出？')) {
    localStorage.removeItem('currentUserId');
    localStorage.removeItem('currentUserName');
    localStorage.removeItem('isAdmin');
    window.location.href = '/login.html';
  }
}

async function refreshPanel() {
  const r = await fetch(API + '/api/v1/user/token/usage', { headers: { 'X-User-Id': uid() } });
  const j = await r.json();
  if (!j.success || !j.rawData) { alert(j.message || '获取失败'); return; }
  const d = j.rawData;
  document.getElementById('up-quota').textContent = (d.daily_limit || 0).toLocaleString();
  document.getElementById('up-used').textContent = (d.used_today || 0).toLocaleString();
  document.getElementById('up-remain').textContent = ((d.remaining !== undefined ? d.remaining : ((d.daily_limit||0) - (d.used_today||0)))).toLocaleString();
  const quota = d.daily_limit || 100000;
  const used = d.used_today || 0;
  const pct = quota > 0 ? Math.min(100, Math.round(used / quota * 100)) : 0;
  const bar = document.getElementById('up-bar');
  bar.style.width = pct + '%';
  const st = document.getElementById('up-status');
  if (d.status === 'over' || (quota > 0 && used >= quota)) {
    bar.classList.add('over'); st.className = 'status over'; st.textContent = '⚠ 今日 Token 已超额，无法继续对话';
    document.getElementById('start-btn').disabled = true;
  } else {
    bar.classList.remove('over'); st.className = 'status ok'; st.textContent = '状态正常';
    document.getElementById('start-btn').disabled = false;
  }

  const name = localStorage.getItem('currentUserName');
  if (name) document.getElementById('up-name').textContent = name;
}

async function startChat() {
  // 首先检查配额
  const check = await fetch(API + '/v1/chat/check', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-User-Id': uid() },
    body: JSON.stringify({ userId: Number(uid()), model: model(), estimatedTokens: 5000 })
  });
  const j = await check.json();
  const tip = document.getElementById('check-tip');
  if (j.allowed) {
    tip.innerHTML = '<span style="color:var(--success)">✓ 检测通过，可发起对话。</span>';
    document.getElementById('chat-card').style.display = 'block';
    document.getElementById('start-btn').disabled = true;
    refreshPanel();
  } else {
    tip.innerHTML = '<span class="warn">✗ 配额不足，无法发起对话。已用 ' + j.used.toLocaleString() + ' / 限额 ' + j.quota.toLocaleString() + '</span>';
    refreshPanel();
  }
}

async function sendMessage() {
  const tok = parseInt(document.getElementById('tok').value, 10) || 5000;
  // 服务端拦截器会自动拦截超额用户的请求，返回 403
  const r = await fetch(API + '/v1/chat/usage', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-User-Id': uid() },
    body: JSON.stringify({ userId: Number(uid()), model: model(), promptTokens: Math.round(tok*0.3), completionTokens: Math.round(tok*0.7) })
  });
  const j = await r.json();
  if (j.success) {
    document.getElementById('chat-log').textContent += '\n[已记录消耗 ' + tok + ' tokens，模型：' + model() + ']';
    document.getElementById('msg').value = '';
    refreshPanel();
  } else {
    alert(j.message || '发送失败');
  }
}

(function init() {
  const stored = localStorage.getItem('currentUserId');
  if (stored) document.getElementById('uid').value = stored;
  const name = localStorage.getItem('currentUserName');
  if (name) document.getElementById('up-name').textContent = name;
  refreshPanel();
})();
</script>
</body>
</html>
